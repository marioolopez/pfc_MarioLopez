<div class="container mt-4">

  <button class="btn btn-outline-secondary mb-3" (click)="cancelar()">atrás</button>

  <h2 class="mb-4 text-center">Mis resultados</h2>

  <table class="table table-striped table-hover" *ngIf="resultados.length; else sinResultados">
    <thead class="table-dark">
      <tr>
        <th>Examen</th>
        <th>Nota</th>
        <th>Fecha realización</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let r of resultados">
        <td>{{r.examen?.titulo || r.id_examen}}</td>
        <td>{{r.nota | number:'1.1-2'}}</td>
        <td>{{r.fecha_realizacion | date:'short'}}</td>
      </tr>
    </tbody>
  </table>

  <ng-template #sinResultados>
    <p class="text-muted text-center">aun no has realizado ningún examen</p>
  </ng-template>
</div>
