<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-4">Registro</h3>

    <form (ngSubmit)="registrar()">
      <!--Nombre-->
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" [(ngModel)]="nombre" name="nombre" required>
      </div>

      <!--Email-->
      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" [(ngModel)]="email" name="email" required>
      </div>

      <!--Contraseña-->
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" [(ngModel)]="contrasena" name="contrasena" required>
      </div>

      <!--Rol-->
      <div class="mb-3">
        <label class="form-label">Rol</label>
        <input type="text" class="form-control" [(ngModel)]="rol" name="rol" readonly>
        <small class="text-muted">Por defecto, solo se registran alumnos.</small>
      </div>

      <!--Botón-->
      <button type="submit" class="btn btn-success w-100">Registrarse</button>
    </form>
  </div>
</div>
