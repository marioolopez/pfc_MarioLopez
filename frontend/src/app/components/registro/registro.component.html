<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-4">Registro</h3>

    <form #f="ngForm" (ngSubmit)="registrar(f)">
      <!--nombre-->
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" [(ngModel)]="usuario.nombre" name="nombre" required>
      </div>

      <!--email-->
      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" [(ngModel)]="usuario.email" name="email" required email>
      </div>

      <!--contraseña-->
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" [(ngModel)]="usuario.contrasena" name="contrasena" required minlength="5">
      </div>

      <!--botón-->
      <button type="submit" class="btn btn-success w-100" [disabled]="f.invalid">
        Registrarse
      </button>
    </form>

  </div>
</div>
